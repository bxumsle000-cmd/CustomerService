# ============================================================================
# 用法（都在專案根目錄，也就是這個檔案所在的位置下指令）
#
# 平常開發，app 在 IntelliJ 跑
#     不用下指令，資料庫開機會自動起來。IDEA 按 Run → http://localhost:8080
#
# 第一次跑 / 換一台新電腦
#     docker compose up -d
#     然後 IDEA 按 Run
#
# 整組砍掉重來（會清空所有工單與客服帳號）
#     docker compose down -v
#     docker compose up -d
#     然後 IDEA 按 Run
#
# 完整驗收，app 也跑在容器裡（第一次，或改過程式碼）
#     docker compose --profile full up -d --build
#     → http://localhost:8081
#
# 完整驗收，沒改過程式碼（含電腦重開後要再開一次）
#     docker compose --profile full up -d
#     → http://localhost:8081
#
# 看容器版 app 的 log
#     docker compose logs -f app
#
# 關掉容器版 app，資料庫繼續留著
#     docker compose stop app
#
# 全部關掉，資料保留
#     docker compose down
#
# 用 SSMS 連進容器裡的資料庫
#     伺服器名稱：localhost,14334
#     驗證：SQL Server 驗證
#     登入：sa
#     密碼：見下方 MSSQL_SA_PASSWORD
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 資料庫：SQL Server 2022
  # --------------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # 容器名稱是「整台電腦共用」的，不分專案，所以一定要跟其他專案錯開。
    container_name: cs-db
    # 左邊是你電腦的埠號，右邊是容器內的
    ports:
      - "14334:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cs_Ticket_2648"
      MSSQL_PID: "Developer"          # 開發用授權，免費
    volumes:
      - mssql-data:/var/opt/mssql     # 具名 volume，資料才不會隨容器消失
    restart: unless-stopped
    healthcheck:
      # 讓 compose 知道「資料庫真的可以接受連線了」，不然 app 會太早啟動而連不上
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --------------------------------------------------------------------------
  # 建立資料庫：跑一次就結束的一次性容器
  #
  # 為什麼需要這個？因為 Flyway 建得了「資料表」，建不了「資料庫」本身；
  # 而 SQL Server 的官方 image 不像 MySQL/Postgres 有環境變數可以自動建 DB，
  # 所以要自己補這一步。
  # --------------------------------------------------------------------------
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cs-db-init
    depends_on:
      db:
        condition: service_healthy    # 等 db 通過上面的 healthcheck 才開始
    environment:
      MSSQL_SA_PASSWORD: "Cs_Ticket_2648"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID('customer_service') IS NULL CREATE DATABASE customer_service;"
    restart: "no"                     # 跑完就結束，不要重啟

  # --------------------------------------------------------------------------
  # 應用程式：用同目錄的 Dockerfile 編譯
  # --------------------------------------------------------------------------
  app:
    build: .
    container_name: cs-app
    ports:
      # 左邊 8081 是給容器版用的，避免跟 IDEA 直接跑的 8080 撞在一起。
      - "8081:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully   # 等資料庫建好才啟動
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://db:1433;databaseName=customer_service;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "Cs_Ticket_2648"
    profiles: ["full"]

volumes:
  # 具名 volume 會自動加上專案名前綴（customerservice_mssql-data），
  # 所以跟 SlotMachineGame 的同名 volume 不會混在一起，這裡不用改名。
  mssql-data:
