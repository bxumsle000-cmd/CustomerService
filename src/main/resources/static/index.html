<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電話客服工單系統 — 原型</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc;
    --ink:#1a1d24; --muted:#5b6472; --faint:#8a92a0;
    --line:#e4e7ec; --line-strong:#d0d5dd;
    --accent:#4f46e5; --accent-h:#4338ca; --accent-bg:#eef2ff; --accent-tx:#3730a3;
    --green:#067647; --green-bg:#ecfdf3;
    --amber:#b54708; --amber-bg:#fffaeb;
    --red:#b42318; --red-bg:#fef3f2;
    --slate:#475467; --slate-bg:#f2f4f7;
    --r:8px; --r-lg:12px;
    --shadow:0 1px 2px rgba(16,24,40,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--accent);text-decoration:none}

  /* ---------- login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  .login-card{width:340px;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-lg);padding:32px 28px;box-shadow:var(--shadow)}
  .login-card .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;margin-bottom:22px}
  .login-card .brand .dot{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  input[type=text],input[type=password],select,textarea{width:100%;padding:9px 11px;border:.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r);border:.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:14px;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-h)}
  .btn.danger{background:var(--red);border-color:var(--red);color:#fff}
  .btn.danger:hover{filter:brightness(.94)}
  .btn.full{width:100%;justify-content:center}
  .btn.sm{padding:6px 11px;font-size:13px}

  /* ---------- app shell ---------- */
  #app{display:none;height:100%}
  #app.on{display:grid;grid-template-columns:216px 1fr}
  .sidebar{background:var(--surface);border-right:.5px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
  .sidebar .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:4px 8px 16px}
  .sidebar .brand .dot{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);color:var(--muted);font-size:14px;cursor:pointer}
  .nav a .ic{width:18px;text-align:center;opacity:.85}
  .nav a:hover{background:var(--surface-2)}
  .nav a.active{background:var(--accent-bg);color:var(--accent-tx);font-weight:500}
  .nav a .count{margin-left:auto;font-size:12px;background:var(--slate-bg);color:var(--slate);padding:1px 7px;border-radius:10px}
  .side-foot{margin-top:auto;border-top:.5px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:9px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent-tx);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .side-foot .st{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px}
  .side-foot .st .d{width:7px;height:7px;border-radius:50%;background:var(--green)}

  .main{display:flex;flex-direction:column;overflow:hidden;height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:.5px solid var(--line);background:var(--surface)}
  .topbar h1{font-size:16px;font-weight:600;margin:0}
  .topbar .spacer{flex:1}
  .search{display:flex;align-items:center;gap:7px;border:.5px solid var(--line-strong);border-radius:var(--r);padding:7px 11px;color:var(--faint);min-width:180px;background:var(--surface)}
  .search input{border:none;outline:none;padding:0;flex:1;background:transparent}

  /* active call bar */
  #callbar{display:none;align-items:center;gap:14px;padding:12px 22px;background:var(--accent-bg);border-bottom:.5px solid #c7d2fe}
  #callbar.on{display:flex}
  #callbar .pi{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent)}
  #callbar .who{color:var(--accent-tx)}
  #callbar .who b{font-size:15px}
  #callbar .who div{font-size:12.5px;opacity:.85}
  #callbar .timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;color:var(--accent-tx);margin-left:auto}
  .icobtn{width:38px;height:38px;border-radius:50%;border:.5px solid var(--line-strong);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
  .icobtn.red{background:var(--red);border-color:var(--red);color:#fff}

  .view{padding:22px;overflow:auto;flex:1}

  /* generic pieces */
  .card{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .l{font-size:13px;color:var(--muted)}
  .kpi .v{font-size:27px;font-weight:600;margin-top:5px}
  .kpi .s{font-size:12px;margin-top:3px;color:var(--faint)}
  .sec-title{font-size:14px;font-weight:600;margin:22px 0 10px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-weight:500;color:var(--muted);padding:9px 10px;border-bottom:.5px solid var(--line)}
  tbody td{padding:11px 10px;border-bottom:.5px solid var(--line)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-2)}
  .mono{color:var(--accent);font-variant-numeric:tabular-nums}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
  .b-open{background:var(--accent-bg);color:var(--accent-tx)}
  .b-prog{background:var(--amber-bg);color:var(--amber)}
  .b-pend{background:var(--slate-bg);color:var(--slate)}
  .b-res{background:var(--green-bg);color:var(--green)}
  .b-closed{background:var(--slate-bg);color:var(--faint)}
  .b-over{background:var(--red-bg);color:var(--red)}
  .pri-HIGH{color:var(--red);font-weight:500}
  .pri-MEDIUM{color:var(--muted)}
  .pri-LOW{color:var(--faint)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:6px 13px;border-radius:20px;border:.5px solid var(--line-strong);background:var(--surface);font-size:13px;color:var(--muted)}
  .chip:hover{background:var(--surface-2)}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.danger.active{background:var(--red);border-color:var(--red)}

  .two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  .panel{padding:18px 20px}
  .kv{display:flex;flex-direction:column;gap:13px;font-size:13.5px}
  .kv .k{color:var(--muted);font-size:12.5px;margin-bottom:3px}
  .divide{border-top:.5px solid var(--line);padding-top:13px}

  .timeline{display:flex;flex-direction:column;gap:15px;margin-top:6px}
  .tl{display:flex;gap:11px}
  .tl .av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .tl .av.user{background:var(--accent-bg);color:var(--accent-tx)}
  .tl .av.sys{background:var(--slate-bg);color:var(--slate)}
  .tl .meta{font-size:13px}
  .tl .meta .t{color:var(--faint)}
  .tl .body{font-size:13.5px;color:var(--muted);margin-top:2px}
  /* 操作記錄（轉派這類）：掛在某個客服名下，但不是他「說」的話，
     所以用比留言更淡的字重畫，跟真正的人工留言區分開。 */
  .tl .body.act{color:var(--faint);font-style:italic}

  .addrow{display:flex;gap:9px;margin-top:16px}
  .addrow input{flex:1}
  .hist{display:flex;flex-direction:column;gap:11px;font-size:13px}
  .hist .h{}
  .hist .h .s{color:var(--faint);font-size:12.5px}

  .disp{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .disp .d{padding:6px 13px;border-radius:20px;border:.5px solid var(--line-strong);font-size:13px;color:var(--muted)}
  .disp .d.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .empty{color:var(--faint);text-align:center;padding:34px}
  .idle{text-align:center;padding:46px 20px}
  .idle .big{width:56px;height:56px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:12px;cursor:pointer}
  .backlink:hover{color:var(--ink)}
  .form-narrow{max-width:520px}
  .req{color:var(--red)}
  .pagehead{display:flex;align-items:center;margin-bottom:14px}
  .pagehead .acts{margin-left:auto;display:flex;gap:8px}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:.5px solid var(--line)}
  .tab{padding:8px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-.5px;cursor:pointer}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
  .fbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:14px 16px;margin-bottom:14px}
  .fi{display:flex;flex-direction:column;gap:5px}
  .fi label{font-size:12px;color:var(--muted)}
  .fi input,.fi select{padding:7px 10px;min-width:130px}
  .fbar .reset{align-self:flex-end;margin-bottom:1px}
  .pager{display:flex;align-items:center;gap:12px;padding:12px 4px 0;font-size:13px;color:var(--muted)}
  .pager select{padding:6px 8px;min-width:auto}
  .pager .nav{margin-left:auto;display:flex;align-items:center;gap:6px}
  .pgbtn{width:30px;height:30px;border-radius:var(--r);border:.5px solid var(--line-strong);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .pgbtn:disabled{opacity:.4;cursor:default}
  .hist .h{padding:5px 6px;border-radius:6px;margin:0 -6px}
  .hist .h:hover{background:var(--surface-2)}
  .minipager{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted)}
  .pgbtn.sm{width:26px;height:26px;font-size:14px}
  .cal-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
  .cal-cell{min-height:64px;border:.5px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;background:var(--surface)}
  .cal-cell:hover{background:var(--surface-2)}
  .cal-cell.other{opacity:.38}
  .cal-cell.today .dnum{color:var(--accent);font-weight:600}
  .cal-cell.sel{background:var(--accent-bg);border-color:var(--accent)}
  .cal-cell .dnum{font-size:13px}
  .cal-cell .cnt{font-size:11px;color:#fff;background:var(--accent);border-radius:10px;padding:1px 7px;align-self:flex-start}
  .day-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:.5px solid var(--line);border-radius:8px;margin-bottom:8px}
  .day-item .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;min-width:42px}
  .day-item .grow{flex:1;min-width:0;cursor:pointer}
  .day-item .grow:hover *{color:var(--accent)}

  /* ---------- 客服狀態下拉選單 ---------- */
  .stat-wrap{position:relative}
  .stat-btn{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:var(--r);border:.5px solid transparent;cursor:pointer;user-select:none}
  .stat-btn:hover{background:var(--surface-2);border-color:var(--line)}
  .stat-av{position:relative}
  .stat-av .dotst{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface)}
  .stat-cur{font-size:12px;display:flex;align-items:center;gap:5px;justify-content:flex-end}
  .stat-cur .d{width:7px;height:7px;border-radius:50%;flex:none}
  .stat-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:186px;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 20px rgba(16,24,40,.14);padding:6px;display:none}
  .stat-menu.on{display:block}
  .stat-menu .mi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:13.5px;cursor:pointer}
  .stat-menu .mi:hover{background:var(--surface-2)}
  .stat-menu .mi.dis{cursor:default;opacity:.45}
  .stat-menu .mi.dis:hover{background:transparent}
  .stat-menu .mi .d{width:8px;height:8px;border-radius:50%;flex:none}
  .stat-menu .mi .ck{margin-left:auto;color:var(--accent);font-size:12px}
  .stat-menu .lock{padding:7px 10px;font-size:12px;color:var(--faint);line-height:1.45}
  .stat-menu .sep{border-top:.5px solid var(--line);margin:5px 2px}
  @media(max-width:820px){#app.on{grid-template-columns:1fr}.sidebar{display:none}.two{grid-template-columns:1fr}.cal-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="brand"><span class="dot">☎</span>電話客服工單系統</div>
    <div class="field"><label>客服代號</label><input type="text" id="lg-user" value="CSC00001"></div>
    <div class="field"><label>密碼</label><input type="password" id="lg-pass" value="········"></div>
    <button class="btn primary full" onclick="doLogin()" style="margin-top:8px">登入</button>
    <p style="font-size:12px;color:var(--faint);margin:14px 0 0;text-align:center">原型 demo — 直接點登入即可</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot">☎</span>客服工作台</div>
    <nav class="nav" id="nav">
      <a data-screen="tickets"><span class="ic">🏠</span>首頁<span class="count" id="nav-tk">0</span></a>
      <a data-screen="console"><span class="ic">📞</span>工作台</a>
    </nav>
    <div class="side-foot">
      <div class="avatar">客</div>
      <div><div style="font-size:13px;font-weight:500">CSC00001</div><div class="st" id="side-status"><span class="d"></span>線上</div></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="screen-title">工作台</h1>
      <div class="spacer"></div>
    </div>

    <div id="callbar">
      <span class="pi">☎</span>
      <div class="who" onclick="go('console')" style="cursor:pointer" title="返回通話表單"><b id="cb-name"></b><div id="cb-phone"></div></div>
      <span class="timer" id="cb-timer">00:00</span>
      <span class="icobtn">🔇</span>
      <span class="icobtn red" id="cb-hangup" onclick="endCall()" title="掛斷">☎</span>
    </div>

    <div class="view" id="view"></div>
  </div>
</div>

<script>
/* =================== DATA =================== */
const STATUS = {
  IN_PROGRESS:{label:'處理中',cls:'b-prog'},
  PENDING:{label:'待客戶回覆',cls:'b-pend'},
  RESOLVED:{label:'已解決',cls:'b-res'},
};
/* 狀態機:每個狀態的合法下一步 */
const TRANSITIONS = {
  IN_PROGRESS:['PENDING','RESOLVED'],
  PENDING:['IN_PROGRESS','RESOLVED'],
  RESOLVED:['IN_PROGRESS'],
};
const PRI = {HIGH:'高',MEDIUM:'中',LOW:'低'};
const CATS = ['帳號問題','付款/發票','課程內容','退款','其他'];

/* 客服狀態：ON_CALL 由系統自動切換，不可手選 */
const AGENT_STATUS = {
  ONLINE  :{label:'線上',  c:'var(--green)'},
  ON_CALL :{label:'通話中',c:'var(--accent)',auto:true},
  BREAK   :{label:'休息',  c:'var(--amber)'},
  RESTROOM:{label:'廁所',  c:'var(--amber)'},
  LUNCH   :{label:'午休',  c:'var(--amber)'},
  MEETING :{label:'簡報',  c:'var(--slate)'},
};
/* 可手動選擇的狀態（依選單顯示順序） */
const PICKABLE_STATUS = ['ONLINE','BREAK','RESTROOM','LUNCH','MEETING'];

let uid = 900;
const now = Date.now();
const hrs = h => now - h*3600*1000;

/* 每張工單一個隨機且唯一的工單號 TK-XXXXXX */
const usedNos = new Set();
function genTicketNo(){ let n; do{ n='TK-'+Math.floor(100000+Math.random()*900000); }while(usedNos.has(n)); usedNos.add(n); return n; }

/* 客服代號 CSC+5碼；ME 為目前登入的客服（自己） */
const ME = 'CSC00001';
const ME_NAME = '林曉明';
const AGENTS = ['CSC00001','CSC00002','CSC00003'];

const customers = [
  {id:1,name:'王經理',company:'宏達電子',phone:'02-2345-6789',email:'wang@handa.com',tier:'白金客戶'},
  {id:2,name:'陳小姐',company:'台興實業',phone:'04-2233-1188',email:'chen@taixing.com',tier:'一般客戶'},
  {id:3,name:'李先生',company:'聯達科技',phone:'03-567-8899',email:'lee@lianda.com',tier:'一般客戶'},
  {id:4,name:'張總',company:'大同貿易',phone:'02-8765-4321',email:'chang@datong.com',tier:'白金客戶'},
  {id:5,name:'林同學',company:'個人',phone:'0912-345-678',email:'lin@gmail.com',tier:'個人用戶'},
];

let tickets = [
  mk('TK-0842',1,'帳號無法登入','客戶重設密碼後仍無法登入，初判帳號遭鎖定。','IN_PROGRESS','HIGH','帳號問題','PHONE',hrs(1),hrs(-1),[
    sys('工單經電話進線建立',hrs(3)),
    sys('狀態變更為「處理中」，指派給 '+ME,hrs(2.7)),
    usr(ME,'已致電客戶，確認為帳號被鎖定，正在協助解鎖。',hrs(0.4)),
  ]),
  mk('TK-0841',2,'發票金額有誤','當月發票金額與訂單不符，需重新開立。','IN_PROGRESS','MEDIUM','付款/發票','EMAIL',hrs(4),hrs(20),[
    sys('工單經 Email 進線建立',hrs(4)),
  ]),
  mk('TK-0838',3,'課程影片打不開','付費課程影片點擊後一直轉圈無法播放。','IN_PROGRESS','HIGH','課程內容','PHONE',hrs(30),hrs(-6),[
    sys('工單經電話進線建立',hrs(30)),
  ]),
  mk('TK-0835',4,'想申請退款','購買後七日內申請退款。','PENDING','LOW','退款','PHONE',hrs(50),hrs(30),[
    sys('工單經電話進線建立',hrs(50)),
    usr(AGENTS[1],'已說明退款流程，等待客戶回傳申請表。',hrs(48)),
    sys('狀態變更為「待客戶回覆」',hrs(48)),
  ]),

function mk(no,custId,title,desc,status,pri,cat,ch,created,due,comments){
  /* updatedAt：有留言就取最後一則的時間，沒有就等於建立時間。
     對應後端 Tickets.applyDefaults()——從沒被動過的工單，updated_at 等於 created_at。 */
  const updated=(comments&&comments.length)?Math.max(created,...comments.map(c=>c.time)):created;
  return {id:++uid,no:genTicketNo(),custId,title,desc,status,pri,cat,channel:ch,assignee:ME,contactPhone:'',followUp:null,createdAt:created,updatedAt:updated,dueAt:due,comments};
}
function sys(text,t){return {system:true,author:'系統',content:text,time:t}}
function usr(a,text,t){return {system:false,author:a,content:text,time:t}}
/* 操作記錄：有人做的（所以掛他的代號），但不是留言。
   對應後端 writeComment(ticket, me, ...)——agentId 不是 null，畫面上就不會顯示成「系統」。
   內容不要再寫一次「由某某」，執行者已經在上面那行的作者欄了。 */
function act(a,text,t){return {system:false,action:true,author:a,content:text,time:t}}
/* 「碰一下」工單：任何算是動靜的操作都要呼叫，首頁的「更新時間」才會跟著動。
   對應後端要注意的坑——新增留言只會 INSERT 到 ticket_comments，不會觸發 Tickets 的
   @PreUpdate，所以 TicketService 那邊也必須在同一個交易裡主動更新工單本身。 */
function touch(t){ t.updatedAt=Date.now(); }

/* 歷史紀錄（含分頁），可獨立重繪不影響表單 */
function buildHist(phone){
  const past=historyByPhone(phone);
  const size=4;
  const pages=Math.max(1,Math.ceil(past.length/size));
  if(state.callHistPage>pages)state.callHistPage=pages;
  const rows=past.slice((state.callHistPage-1)*size,(state.callHistPage-1)*size+size);
  const list=past.length
    ? rows.map(t=>`<div class="h" onclick="openTicket(${t.id})" style="cursor:pointer" title="開啟此工單"><div>${badge(t)} ${esc(t.title)}</div><div class="s">${t.no} · ${fmt(t.createdAt)}</div></div>`).join('')
    : '<div style="color:var(--faint)">查無此號碼的歷史紀錄（可能是新客戶）</div>';
  const pager=past.length>size
    ? `<div class="minipager"><button class="pgbtn sm" onclick="histPage(${state.callHistPage-1})" ${state.callHistPage<=1?'disabled':''}>‹</button><span>第 ${state.callHistPage} / ${pages} 頁</span><button class="pgbtn sm" onclick="histPage(${state.callHistPage+1})" ${state.callHistPage>=pages?'disabled':''}>›</button></div>`
    : '';
  return `<div class="k" style="margin-bottom:9px">此號碼歷史紀錄（${past.length}）</div><div class="hist">${list}</div>${pager}`;
}
function histPage(p){ state.callHistPage=p; $('#histbox').innerHTML=buildHist(state.activeCall.phone); }

/* =================== SIMULATE CALL =================== */
/* 來電號碼池：多數是既有客戶號碼，也有陌生號碼（無歷史） */
const CALL_NUMBERS=customers.map(c=>c.phone).concat(['0987-111-222','02-9999-0000']);
function simulateCall(){
  if(state.activeCall){go('console');return;} /* 目前工單尚未完成（通話中或已掛斷未建單）→ 不能接下一通，先回去把單完成 */
  const phone=CALL_NUMBERS[Math.floor(Math.random()*CALL_NUMBERS.length)];
  state.callReturn = ['tickets','calendar'].includes(state.screen) ? state.screen : 'tickets'; /* 記住接聽前所在頁 */
  state.activeCall={phone,start:Date.now()};
  state.disposition='RESOLVED';
  state.callHistPage=1;
  state.callDraft={};
  setAgentStatusAuto('ON_CALL'); /* 接聽 → 自動變成通話中 */
  $('#cb-name').textContent=phone;
  $('#cb-phone').textContent='來電進線 · 號碼未識別';
  $('#cb-hangup').style.display='';
  $('#callbar').classList.add('on');
  clearInterval(callTimer);
  callTimer=setInterval(()=>{const s=Math.floor((Date.now()-state.activeCall.start)/1000);const p=n=>String(n).padStart(2,'0');$('#cb-timer').textContent=p(Math.floor(s/60))+':'+p(s%60);},500);
  go('console');
}
function endCall(fromCreate){
  clearInterval(callTimer);
  setAgentStatusAuto('ONLINE'); /* 通話結束 → 自動變回線上 */
  if(fromCreate){ /* 按「建立工單並結束通話」才真正收掉整通並導向工單（createFromCall 負責 go） */
    state.activeCall=null; state.callDraft={};
    $('#callbar').classList.remove('on');
    $('#cb-hangup').style.display='';
    return;
  }
  /* 使用者掛掉電話：只結束通話，人「留在原地」，表單完全不動、內容不清空，讓客服完成後處理再建單 */
  if(state.activeCall) state.activeCall.ended=true;
  $('#cb-phone').textContent='通話已結束 · 完成後建立工單';
  $('#cb-hangup').style.display='none';
  /* 刻意不呼叫 go()、不重繪 #view：畫面與表單原封不動停在原本頁面 */
}

  return tickets.filter(t=>{
    const c=cust(t.custId);
    if(!tabMatch(L.tab,t))return false;
    if(L.fNo && !t.no.toLowerCase().includes(L.fNo.toLowerCase()))return false;
    if(L.fName && !c.name.toLowerCase().includes(L.fName.toLowerCase()))return false;
    if(L.fPhone && !c.phone.includes(L.fPhone))return false;
    if(L.fAssignee && !t.assignee.toLowerCase().includes(L.fAssignee.toLowerCase()))return false;
    /* 時間篩選刻意用 createdAt：「近 7 天」指的是最近 7 天「進來」的案件，
       不是最近 7 天被碰過的案件（否則半年前的老單今天被動一下就會跑出來）。 */
    if(L.fTime!=='ALL'){ const days={D1:1,D7:7,D30:30}[L.fTime]; if(now-t.createdAt > days*86400000)return false; }
    return true;
  }).sort((a,b)=>b.updatedAt-a.updatedAt);   /* 預設排序：最近有動靜的排前面 */
}

function reassign(){
  const t=tickets.find(x=>x.id===state.currentTicket);
  const to=$('#r-assignee-code').value.trim();
  if(!to){$('#r-assignee-code').focus();$('#r-assignee-code').style.borderColor='var(--red)';return;}
  if(to===t.assignee) return;
  /* 執行轉派的是目前登入的客服（ME），不是工單原本的負責人，
     對應後端 TicketService.assigne() 的 currentAgentProvider.currentAgentId()。 */
  t.comments.push(act(ME,`轉派給 ${to}`,Date.now()));
  t.assignee=to;touch(t);
  renderTicket($('#view'));
}
function changeStatus(ns){
  const t=tickets.find(x=>x.id===state.currentTicket);
  if(!TRANSITIONS[t.status].includes(ns)){alert('非法的狀態轉換');return;} /* 狀態機守門 */
  t.comments.push(sys(`狀態由「${STATUS[t.status].label}」變更為「${STATUS[ns].label}」`,Date.now()));
  t.status=ns;touch(t);renderTicket($('#view'));
}
function addComment(){
  const el=$('#cm');const txt=el.value.trim();if(!txt)return;
  const t=tickets.find(x=>x.id===state.currentTicket);
  t.comments.push(usr(ME,txt,Date.now()));touch(t);el.value='';renderTicket($('#view'));
}

/* =================== 行事曆 =================== */
const DOW=['日','一','二','三','四','五','六'];
const startOfDay=(y,m,d)=>new Date(y,m,d).getTime();
const sameYMD=(ts,y,m,d)=>{const x=new Date(ts);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d;};
const fmtHM=ts=>{const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());};
/* 可排入行事曆的案件：自己的、且狀態為處理中或等待客戶回覆 */
const followables=()=>tickets.filter(t=>t.assignee===ME && (t.status==='IN_PROGRESS'||t.status==='PENDING'));
const dayFollowups=(y,m,d)=>tickets.filter(t=>t.assignee===ME && t.followUp && sameYMD(t.followUp,y,m,d)).sort((a,b)=>a.followUp-b.followUp);

function renderCalendar(v){
  if(state.cal.y===null){ const t=new Date(); t.setHours(0,0,0,0); state.cal={y:t.getFullYear(),m:t.getMonth(),sel:t.getTime()}; }
  const C=state.cal;
  const today=new Date(); today.setHours(0,0,0,0);
  const gridStart=new Date(C.y,C.m,1-new Date(C.y,C.m,1).getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const dt=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
    const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate();
    const cnt=dayFollowups(y,m,d).length;
    cells+=`<div class="cal-cell ${m!==C.m?'other':''} ${dt.getTime()===today.getTime()?'today':''} ${C.sel&&sameYMD(C.sel,y,m,d)?'sel':''}" onclick="calSelect(${y},${m},${d})">
      <div class="dnum">${d}</div>${cnt?`<div class="cnt">${cnt} 件</div>`:''}
    </div>`;
  }
  const sel=new Date(C.sel);
  const sy=sel.getFullYear(),sm=sel.getMonth(),sd=sel.getDate();
  const items=dayFollowups(sy,sm,sd);
  const elig=followables();
  v.innerHTML=`
    <div class="cal-wrap">
      <div class="card panel">
        <div class="cal-head">
          <button class="pgbtn" onclick="calMonth(-1)">‹</button>
          <div style="font-weight:600;font-size:15px;min-width:118px;text-align:center">${C.y} 年 ${C.m+1} 月</div>
          <button class="pgbtn" onclick="calMonth(1)">›</button>
          <button class="btn sm" style="margin-left:auto" onclick="calToday()">今天</button>
        </div>
        <div class="cal-grid">${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
      </div>
      <div class="card panel">
        <div style="font-weight:600;margin-bottom:2px">${sm+1} 月 ${sd} 日（週${DOW[sel.getDay()]}）</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">當日跟進 / 回電安排</div>
        ${items.length?items.map(t=>{const c=cust(t.custId);return `<div class="day-item">
          <div class="t">${fmtHM(t.followUp)}</div>
          <div class="grow" onclick="openTicket(${t.id})">
            <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</div>
            <div style="font-size:12px;color:var(--muted)">${t.no} · ${c.name} · ${c.phone}</div>
          </div>
          ${badge(t)}
          <span class="icobtn" style="width:26px;height:26px;font-size:12px" title="移除" onclick="calRemove(${t.id})">✕</span>
        </div>`}).join(''):'<div style="color:var(--faint);padding:6px 0 14px">這天還沒有安排</div>'}
        <div style="border-top:.5px solid var(--line);margin-top:6px;padding-top:12px">
          <div style="font-size:13px;font-weight:500;margin-bottom:8px">加入案件到這天</div>
          ${elig.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select id="cal-pick" style="flex:1;min-width:150px">${elig.map(t=>`<option value="${t.id}">${t.no}｜${esc(t.title)}（${STATUS[t.status].label}）</option>`).join('')}</select>
            <input type="time" id="cal-time" value="09:00" style="width:112px">
            <button class="btn sm" onclick="calAdd()">加入</button>
          </div>
          <div style="font-size:12px;color:var(--faint);margin-top:6px">只列出你「處理中 / 等待客戶回覆」的案件；一張案件只會排在一天，重排即覆蓋。</div>`
          :'<div style="color:var(--faint)">目前沒有可排入的案件</div>'}
        </div>
      </div>
    </div>`;
}
function calSelect(y,m,d){ state.cal.y=y; state.cal.m=m; state.cal.sel=startOfDay(y,m,d); renderCalendar($('#view')); }
function calMonth(delta){ const d=new Date(state.cal.y,state.cal.m+delta,1); state.cal.y=d.getFullYear(); state.cal.m=d.getMonth(); renderCalendar($('#view')); }
function calToday(){ const t=new Date(); t.setHours(0,0,0,0); state.cal={y:t.getFullYear(),m:t.getMonth(),sel:t.getTime()}; renderCalendar($('#view')); }
function calAdd(){
  const id=+$('#cal-pick').value; const [hh,mm]=($('#cal-time').value||'09:00').split(':').map(Number);
  const s=new Date(state.cal.sel);
  const t=tickets.find(x=>x.id===id); if(!t)return;
  t.followUp=new Date(s.getFullYear(),s.getMonth(),s.getDate(),hh,mm).getTime(); /* 一張案件只排一天：覆蓋 */
  touch(t);
  renderCalendar($('#view'));
}
function calRemove(id){ const t=tickets.find(x=>x.id===id); if(t){t.followUp=null;touch(t);} renderCalendar($('#view')); }

function setNewDisp(d){ state.newDisp=d; document.querySelectorAll('#ndisp .d').forEach(el=>el.classList.toggle('on',el.dataset.v===d)); }
function saveNew(){
  const title=$('#n-title').value.trim();
  if(!title){$('#n-title').focus();$('#n-title').style.borderColor='var(--red)';return;}
  const name=$('#n-name').value.trim();
  const hon=$('#n-hon').value;
  const dispName = name ? name+hon : '（未提供）';
  const contact=$('#n-contact').value.trim();
  const desc=$('#n-desc').value.trim();
  const status=state.newDisp;
  /* 依聯絡電話找既有客戶；找不到就用這筆建立新客戶（比照通話工單流程） */
  let c = contact ? customers.find(x=>x.phone===contact) : null;
  if(!c){ c={id:++uid,name:dispName,company:'—',phone:contact,email:'',tier:'新客戶'}; customers.push(c); }
  const comments=[sys('工單以新增派件建立',Date.now())];
  if(desc) comments.push(usr(ME,desc,Date.now()));
  comments.push(sys(`狀態設定為「${STATUS[status].label}」`,Date.now()));
  const t=mk('',c.id,title,desc||title,status,'MEDIUM',$('#n-cat').value,'PHONE',Date.now(),Date.now()+8*3600*1000,comments);
  t.contactPhone=contact;
  t.updatedAt=t.createdAt;   /* 剛建立的工單還沒被「更新」過，兩個時間對齊 */
  tickets.unshift(t);
  state.currentTicket=t.id;go('ticket');
}

/* topbar 新增工單 快捷 — 從工單列表提供入口 */
</script>
</body>
