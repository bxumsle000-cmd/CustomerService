# 資料庫連線設定
# 連的是 docker compose 起的 SQL Server 容器（見 docker-compose.yml）。
# 埠號 14334 是容器對外開的，跟以下兩者都錯開，三者可並存：
#   1433  → 本機安裝的那套 SQL Server
#   14333 → SlotMachineGame 專案的容器
# 用之前記得先啟動資料庫：docker compose up -d
#
# 註：app 本身跑在 compose 裡時，這三行會被 compose 的環境變數覆蓋成
#     jdbc:sqlserver://db:1433（走容器內部網路），連到的是同一個資料庫。
spring.datasource.url=jdbc:sqlserver://localhost:14334;databaseName=customer_service;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Cs_Ticket_2648
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway 資料庫版本控管
# 啟動時自動掃 db/migration，把還沒跑過的 migration 依版本號執行
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 這個專案從第一天就用 Flyway 管理，資料庫是全新的空庫，
# 所以不需要 baseline（那是給「已有資料表才導入 Flyway」的舊專案用的）。
# 保持 false 比較安全：萬一哪天歷史紀錄掉了，Flyway 會明確報錯，
# 而不是安靜地跳過 V1 害你以為表建好了。
spring.flyway.baseline-on-migrate=false

# JPA / Hibernate
# 資料表結構一律由 Flyway 負責，絕對不要讓 Hibernate 自己去改結構，
# 所以 ddl-auto 設成 none。
spring.jpa.hibernate.ddl-auto=none
# 關閉 Open Session In View：避免在 Controller 回傳階段才偷偷發 SQL，
# 讓查詢邊界留在 Service 層，效能問題比較容易看出來。
spring.jpa.open-in-view=false
# 開發時把實際執行的 SQL 印出來，方便對照。正式環境請關掉。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP 連線池設定
spring.datasource.hikari.pool-name=MyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
